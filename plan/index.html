function mergeWorkstation(st) {
  const WS = { '進行中': 'doing', '待實測': 'doing', '待確認': 'doing', '待排程': 'idea', '暫緩': 'pause', '已完成': 'done' };
  let a = S.areas.find(x => x.name === '國王才藝');
  if (!a) { a = { id: uid('a'), name: '國王才藝', color: 'orange', vision: '' }; S.areas.push(a); }
  const has = new Set([...S.projects, ...S.tasks, ...S.logs, ...S.outputs].map(x => x.id));
  const n = { p: 0, t: 0, l: 0, o: 0 }, now = nowISO();
  const okP = id => id && S.projects.some(p => p.id === 'ws-' + id);
  for (const p of Array.isArray(st.projects) ? st.projects : []) {
    if (!p || !p.id || !p.name || has.has('ws-' + p.id)) continue;
    S.projects.push({
      id: 'ws-' + p.id, name: String(p.name), areaId: a.id, goalId: '', status: WS[p.status] || 'doing',
      summary: [p.summary || '', p.version ? `版本：${p.version}` : '', p.lane ? `主線：${p.lane}` : ''].filter(Boolean).join('\n'),
      why: '', doneDef: '', next: p.next || '', blocker: [p.status === '待確認' || p.status === '待實測' ? p.status : '', p.blocker || ''].filter(Boolean).join('：'),
      start: '', due: isDate(p.due) ? p.due : '', links: [], archived: !!p.archived, created: now, updated: isDate(p.updated) ? p.updated : today()
    });
    n.p++;
  }
  for (const t of Array.isArray(st.tasks) ? st.tasks : []) {

/* ---------- 同步（GitHub Gist，選用） ---------- */
const sync = { token: '', gistId: '', lastRemote: '', lastAt: '', error: '', busy: false };
const GIST_FILE = 'yy-lifeplan.json';
let syncTimer = 0, pendingRemote = null;
function syncLoad() { try { const o = JSON.parse(store.get(SYNC) || '{}'); sync.token = o.token || ''; sync.gistId = o.gistId || ''; sync.lastRemote = o.lastRemote || ''; sync.lastAt = o.lastAt || ''; } catch (e) {} }
function syncSave() { store.set(SYNC, JSON.stringify({ token: sync.token, gistId: sync.gistId, lastRemote: sync.lastRemote, lastAt: sync.lastAt })); }
function syncOn() { return !!(sync.token && sync.gistId); }
async function gh(path, opt = {}) {
  let r;
  try {
    r = await fetch('https://api.github.com' + path, {
      method: opt.method || 'GET', cache: 'no-store',
      headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + sync.token, 'X-GitHub-Api-Version': '2022-11-28', ...(opt.body ? { 'Content-Type': 'application/json' } : {}) },
      body: opt.body ? JSON.stringify(opt.body) : undefined

  } catch (e) { throw new Error('連不上 GitHub，可能沒有網路'); }
  if (!r.ok) throw new Error(r.status === 401 ? '金鑰無效或已經過期' : r.status === 403 ? '金鑰沒有 Gist 的讀寫權限，或短時間內請求太多次' : r.status === 404 ? '找不到同步用的 Gist（可能被刪掉了）' : `GitHub 回應錯誤（${r.status}）`);
  return r.status === 204 ? null : r.json();
}
const payload = () => JSON.stringify({ app: 'yy-lifeplan', schemaVersion: 1, savedAt: S.updatedAt, state: S });
async function pullRemote() {
  const g = await gh('/gists/' + encodeURIComponent(sync.gistId));
  const f = g && g.files && g.files[GIST_FILE];
  if (!f) throw new Error('Gist 裡找不到資料檔');
  let text = f.content;
  if (f.truncated && safeUrl(f.raw_url)) text = await (await fetch(f.raw_url, { cache: 'no-store' })).text();
  let o = null;
  try { o = JSON.parse(text || 'null'); } catch (e) { throw new Error('雲端的資料檔讀不懂'); }
  return o && o.state ? o : null;
}
async function pushRemote() {
  if (!S.updatedAt) persist({ dirty: false });
  const sentRev = rev, savedAt = S.updatedAt;
  await gh('/gists/' + encodeURIComponent(sync.gistId), { method: 'PATCH', body: { files: { [GIST_FILE]: { content: payload() } } } });
  sync.lastRemote = savedAt;
  if (rev === sentRev) { meta.dirty = false; saveMeta(); }
}
function applyRemote(o) {
  S = normalize(o.state);
  S.updatedAt = o.savedAt || S.updatedAt;
  sync.lastRemote = o.savedAt || '';
  meta.dirty = false;
  persist({ dirty: false, keepTime: true });
  syncSave();
  render();
}
function scheduleSync() { if (!syncOn()) return; clearTimeout(syncTimer); syncTimer = setTimeout(() => syncNow({ quiet: true }), 2500); syncPaint(); }
async function syncNow({ quiet = false, first = false } = {}) {
  if (!syncOn() || !S) return;
  if (sync.busy) { scheduleSync(); return; }
  clearTimeout(syncTimer);
  sync.busy = true; sync.error = ''; syncPaint('同步中…');
  const startRev = rev;
  let note = '';
  try {
    const remote = await pullRemote();
    if (rev !== startRev) { sync.busy = false; scheduleSync(); return; }
    const rAt = remote ? remote.savedAt || '' : '';
    const changed = !!remote && rAt !== sync.lastRemote;
    if (first && remote) {
      if (meaningful(S)) { sync.busy = false; syncPaint(); showConflict(remote, true); return; }
      applyRemote(remote); note = '已讀進雲端的資料';
    } else if (changed && meta.dirty) {
      sync.busy = false; syncPaint(); showConflict(remote, false); return;
    } else if (changed) {
      applyRemote(remote); note = '已讀進另一台裝置的新資料';
    } else if (meta.dirty || !remote) {
      await pushRemote(); note = '已上傳到雲端';
    } else note = '已經是最新的';
    sync.lastAt = nowISO();
    syncSave();
    if (!quiet || note.startsWith('已讀進')) toast(note);
  } catch (e) {
    sync.error = e.message;
    if (!quiet) toast('同步失敗：' + e.message);
  } finally {
    sync.busy = false;
    syncPaint();
  }
}
function showConflict(remote, first) {
  pendingRemote = remote;
  const rp = (remote.state.projects || []).length;
  openModal({
    title: first ? '雲端已經有一份資料' : '兩邊都有新的修改', submit: '',
    body: `<p class="confirm-msg">${first ? '這台裝置也有自己的資料。要用哪一份？' : '這台裝置有還沒上傳的修改，同時雲端也被另一台裝置更新了。要用哪一份？'}</p>
      <div class="choice">
        <button type="button" class="w-opt" data-act="use-remote"><b>用雲端的</b><span>雲端存於 ${esc(fmtTime(remote.savedAt))}・${rp} 個專案。這台的資料會先下載成備份檔。</span></button>
        <button type="button" class="w-opt" data-act="use-local"><b>用這台的</b><span>這台存於 ${esc(fmtTime(S.updatedAt))}・${S.projects.length} 個專案。會蓋過雲端那份。</span></button>
      </div>`

}
async function syncConnect(token) {
  sync.token = tr(token); sync.gistId = ''; sync.lastRemote = ''; sync.error = '';
  sync.busy = true; syncPaint('連線中…');
  const btn = $('[data-form="sync"] button'); if (btn) { btn.disabled = true; btn.textContent = '連線中…'; }
  try {
    let found = null;
    for (let page = 1; page <= 5 && !found; page++) {
      const list = await gh(`/gists?per_page=100&page=${page}`);
      found = (list || []).find(g => g.files && g.files[GIST_FILE]);
      if (!list || list.length < 100) break;
    }
    if (found) {

  if (!f) return;
  clearTimeout(rvTimer); rvForm = f;
  const st = f.querySelector('.rv-state'); if (st) st.textContent = '輸入中…';
  rvTimer = setTimeout(() => saveReview(f, false), 700);
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.closest('dialog')) return;
  const k = f.dataset.form;
  if (!k) return;
  e.preventDefault();
  const field = n => f.elements.namedItem(n);
  if (k === 'quick-task') {
    const title = tr(field('title').value); if (!title) return;
    const pid = field('projectId').value;
    S.tasks.push({ id: uid('t'), projectId: proj(pid) ? pid : '', title, due: '', plan: today(), repeat: '', done: false, doneAt: '', note: '', created: nowISO() });
    field('title').value = '';
    commit('已加入今天');
  } else if (k === 'add-task') {
    const title = tr(field('title').value); if (!title) return;
    const due = field('due').value;
    S.tasks.push({ id: uid('t'), projectId: f.dataset.id, title, due: isDate(due) ? due : '', plan: '', repeat: '', done: false, doneAt: '', note: '', created: nowISO() });
    field('title').value = ''; field('due').value = '';
    commit('已加入待辦');
  } else if (k === 'review') {
    saveReview(f, true); render(); toast('這週的回顧完成了');
  } else if (k === 'sync') {
    syncConnect(field('token').value);
  }
});
document.addEventListener('toggle', e => {
  const d = e.target;
  if (!(d instanceof HTMLDetailsElement) || !d.dataset.key) return;
  if (d.open) { ui.open.add(d.dataset.key); ui.closed.delete(d.dataset.key); }
  else { ui.closed.add(d.dataset.key); ui.open.delete(d.dataset.key); }
}, true);

/* ---------- 開始 ---------- */
load();
syncLoad();
if (!store.get(THEME) && store.get(OLD_THEME)) { store.set(THEME, store.get(OLD_THEME)); store.del(OLD_THEME); }
paintTheme();
render();
darkQuery.addEventListener('change', paintTheme);
window.addEventListener('hashchange', () => { flushReview(); render(); });
window.addEventListener('storage', e => {
  if (e.key === THEME) {
    if (e.newValue === 'light' || e.newValue === 'dark') document.documentElement.dataset.theme = e.newValue; else delete document.documentElement.dataset.theme;
    paintTheme(); if (S && route().view === 'data') render();
    return;
  }
  if (e.key !== KEY) return;
  if (!e.newValue) { S = null; render(); return; }
  try { const o = JSON.parse(e.newValue); if (o && o.state) { S = normalize(o.state); render(); } } catch (err) {}
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') { flushReview(); return; }
  if (S && today() !== lastDay && !dlg.open) render();
  if (S && syncOn()) syncNow({ quiet: true });
});
window.addEventListener('online', () => { if (S && syncOn()) syncNow({ quiet: true }); });
window.addEventListener('pagehide', flushReview);
if (S && syncOn()) syncNow({ quiet: true });
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
})();
</script>
</body>
